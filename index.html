<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9f7df">
  <title>もじで あそぼう！</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body class="home">
  <main class="home-wrap">
    <div class="home-hero">
      <div class="forest">🌳 🐻 🌳 🐰 🌳</div>
      <p class="eyebrow">たのしく ひらがなを おぼえよう</p>
      <h1>もじで<br>あそぼう！</h1>
      <p class="lead">きょうは どのゲームにする？</p>
      <div class="home-animal">🐥 🦊 🐼 🐸</div>
    </div>
    <section class="game-menu" aria-label="ゲームを選ぶ">
      <a class="game-card card-one" href="game1/index.html">
        <span class="game-number">GAME 1</span>
        <span class="game-icon">🔎</span>
        <span class="game-title">ひらがなを<br>さがそう！</span>
        <span class="game-desc">おなじ もじを みつけよう</span>
        <span class="play">あそぶ！ ▶</span>
      </a>
      <a class="game-card card-two" href="game2/index.html">
        <span class="game-number">GAME 2</span>
        <span class="game-icon">🦆</span>
        <span class="game-title">えに あう<br>もじを えらぼう！</span>
        <span class="game-desc">えをみて たりない もじを いれよう</span>
        <span class="play">あそぶ！ ▶</span>
      </a>
    </section>
    <p class="footer-note">⭐ たくさん せいかいできるかな？ ⭐</p>
  </main>
</body>
</html>
